# Temporarily disabled - use simple-deploy.yml instead
name: Full Stack CI/CD Pipeline (Disabled)

on:
  workflow_dispatch: # Manual trigger only

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install backend dependencies
      run: |
        cd backend
        npm ci
        
    - name: Run backend tests
      run: |
        cd backend
        npm test
      env:
        NODE_ENV: test
        MONGODB_URI: ${{ secrets.MONGODB_URI_TEST || 'mongodb://localhost:27017/test' }}
        JWT_SECRET: ${{ secrets.JWT_SECRET || 'test-secret-key' }}

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Run frontend linting
      run: |
        cd frontend
        npm run lint
        
    - name: Build frontend
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_URL: https://greamio-technologies.onrender.com

  deploy:
    name: Deploy Applications
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deployment Status
      run: |
        echo "🚀 Deploying Full Stack Application"
        echo "📦 Backend: Auto-deploying to Render"
        echo "🎨 Frontend: Auto-deploying to Vercel"
        echo "⏳ Deployments will complete automatically"
        
    - name: Post-deployment Health Check
      run: |
        echo "🔍 Running health checks..."
        sleep 90
        
        echo "🔗 Checking Backend Health..."
        curl -f https://greamio-technologies.onrender.com/api/health || echo "Backend health check failed"
        
        echo "🔗 Checking Frontend..."
        curl -f https://greamio-technologies.vercel.app || echo "Frontend health check failed"
        
        echo "✅ Deployment pipeline completed!"