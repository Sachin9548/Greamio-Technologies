name: Backend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths: 
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [ main ]
    paths: 
      - 'backend/**'

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd backend
        npm ci
        
    - name: Run tests
      run: |
        cd backend
        npm test
      env:
        NODE_ENV: test
        MONGODB_URI: ${{ secrets.MONGODB_URI_TEST }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        
    - name: Run linting
      run: |
        cd backend
        npm run lint || echo "No lint script found, skipping..."

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deploy to Render
      run: |
        echo "🚀 Backend will auto-deploy to Render on main branch push"
        echo "✅ Render will automatically pull from GitHub and deploy"
        echo "🔗 Backend URL: https://greamio-technologies.onrender.com"
        
    - name: Health Check
      run: |
        echo "⏳ Waiting for deployment to complete..."
        sleep 60
        curl -f https://greamio-technologies.onrender.com/api/health || echo "Health check failed, but deployment may still be in progress"