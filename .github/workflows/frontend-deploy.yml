name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths: 
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches: [ main ]
    paths: 
      - 'frontend/**'

jobs:
  test:
    name: Test Frontend
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Run linting
      run: |
        cd frontend
        npm run lint
        
    - name: Build application
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_URL: https://greamio-technologies.onrender.com
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/
        retention-days: 1

  deploy:
    name: Deploy to Vercel
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Deploy to Vercel
      run: |
        echo "🚀 Frontend will auto-deploy to Vercel on main branch push"
        echo "✅ Vercel will automatically pull from GitHub and deploy"
        echo "🔗 Frontend URL: https://greamio-technologies.vercel.app"
        
    - name: Health Check
      run: |
        echo "⏳ Waiting for deployment to complete..."
        sleep 30
        curl -f https://greamio-technologies.vercel.app || echo "Health check failed, but deployment may still be in progress"