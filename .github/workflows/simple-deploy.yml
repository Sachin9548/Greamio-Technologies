name: Simple Deploy Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install Backend Dependencies
      run: |
        cd backend
        npm ci
        
    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci
        
    - name: Lint Frontend
      run: |
        cd frontend
        npm run lint
        
    - name: Build Frontend
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_URL: https://greamio-technologies.onrender.com
        
    - name: Deployment Status
      run: |
        echo "✅ Dependencies installed successfully"
        echo "✅ Frontend built successfully"
        echo "✅ Code is ready for deployment"
        echo ""
        echo "🚀 Auto-deployment will happen via:"
        echo "   - Render.com (Backend): https://greamio-technologies.onrender.com"
        echo "   - Vercel (Frontend): https://greamio-technologies.vercel.app"
        echo ""
        echo "📊 Pipeline completed successfully!"

  health-check:
    name: Health Check
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Wait for Deployment
      run: |
        echo "⏳ Waiting for auto-deployment to complete..."
        sleep 120
        
    - name: Check Backend Health
      run: |
        echo "🔍 Checking backend health..."
        curl -f https://greamio-technologies.onrender.com/api/health || echo "⚠️ Backend health check failed (may still be deploying)"
        
    - name: Check Frontend
      run: |
        echo "🔍 Checking frontend..."
        curl -f https://greamio-technologies.vercel.app || echo "⚠️ Frontend health check failed (may still be deploying)"
        
    - name: Deployment Complete
      run: |
        echo "🎉 Deployment pipeline completed!"
        echo "🌐 Your applications should be live at:"
        echo "   Frontend: https://greamio-technologies.vercel.app"
        echo "   Backend:  https://greamio-technologies.onrender.com"